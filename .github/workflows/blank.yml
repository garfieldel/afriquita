name: Build Sonic 3 AIR Android APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # Paso 1: Generar los datos del juego (Equivalente a los scripts .bat)
    - name: Build Game Data Packages
      run: |
        chmod +x Oxygen/sonic3air/___internal/mastering/mastering_linux.sh
        ./Oxygen/sonic3air/___internal/mastering/mastering_linux.sh --data-only
        
    # Paso 2: Copiar los assets generados a la carpeta de Android
    - name: Copy Assets to Android Project
      run: |
        mkdir -p Oxygen/sonic3air/build/_android/app/src/main/assets
        cp -r Oxygen/sonic3air/_master_image_template/data Oxygen/sonic3air/build/_android/app/src/main/assets/
        # Si tienes scripts adicionales de config o audio, se copian aquí

    # Paso 3: Compilar el APK usando Gradle
    - name: Build Release APK with Gradle
      run: |
        cd Oxygen/sonic3air/build/_android
        chmod +x gradlew
        ./gradlew assembleRelease

    # Paso 4: Firmar el APK automáticamente
    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: Oxygen/sonic3air/build/_android/app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    # Paso 5: Guardar el APK final para poder descargarlo
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Sonic3AIR-Android-Release
        path: .
