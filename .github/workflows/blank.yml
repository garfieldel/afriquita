name: main
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup msbuild
        uses: microsoft/setup-msbuild@v2

      - name: build external dependencies
        shell: cmd
        working-directory: framework/external
        run: call build_externals_windows.bat

      # NUEVO PASO CORREGIDO: Descarga Mesa usando PowerShell para evitar errores de formato
      - name: Configurar Gráficos Virtuales (Mesa OpenGL)
        shell: powershell
        run: |
          $url = "https://github.com"
          Invoke-WebRequest -Uri $url -OutFile "mesa.7z"
          # Extraemos el contenido usando 7-Zip que ya viene instalado en GitHub Actions
          & "C:\Program Files\7-Zip\7z.exe" x mesa.7z -o"mesa_extracted"

      - name: Build Mastering
        shell: cmd
        working-directory: Oxygen/sonic3air/___internal/mastering
        run: |
          set msbuildPath=msbuild
          
          echo === Compilando binarios iniciales ===
          msbuild ../../build/_vstudio/sonic3air.sln /property:Configuration=Release /property:Platform=x64 -verbosity:minimal
          
          echo === Inyectando controladores gráficos virtuales ===
          copy "..\..\..\..\mesa_extracted\x64\opengl32.dll" "..\..\bin\Release_x64\" /y
          copy "..\..\..\..\mesa_extracted\x64\libglapi.dll" "..\..\bin\Release_x64\" /y
          
          echo === Procesando scripts .lemon y empaquetando ===
          call mastering_windows_64bit.bat

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air_windows_build
          path: Oxygen/sonic3air/___internal/_MASTER/
          
